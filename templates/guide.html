<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>赋光之人 队伍攻略</title>
<style>
    /* 引入汉仪文黑-85W 字体 */
    @font-face {
        font-family: 'HYWenHei-85W';
        src: url('./汉仪文黑-85W.ttf') format('truetype');
        /* 如果使用 woff2 格式，请改为：src: url('./汉仪文黑-85W.woff2') format('woff2'); */
        font-weight: normal;
        font-style: normal;
    }

    body {
        font-family: 'HYWenHei-85W', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        /* 保留后备字体，防止字体加载失败时页面无法正常显示 */
        background-color: #f4f6f9;
        color: #333;
        margin: 0;
        padding: 20px;
        width: 860px;
        box-sizing: border-box;
    }
    .header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid #4a5568;
    }
    .header h1 {
        color: #2d3748;
        margin: 0;
        font-size: 28px;
    }
    .guide-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        margin-bottom: 25px;
        padding: 20px;
        page-break-inside: avoid;
    }
    .char-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }
    .char-name {
        font-size: 22px;
        font-weight: bold;
        color: #1a202c;
        display: flex;
        align-items: center;
    }
    .char-tags {
        display: flex;
        gap: 10px;
    }
    .tag {
        background: #edf2f7;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 13px;
        color: #4a5568;
    }
    .tag.level { background: #e6fffa; color: #319795; }
    .tag.role { background: #ebf8ff; color: #3182ce; }

    .section {
        margin-bottom: 12px;
    }
    .section-title {
        font-weight: bold;
        color: #2b6cb0;
        font-size: 15px;
        margin-bottom: 5px;
        background: #f0f5ff;
        padding: 3px 8px;
        border-radius: 4px;
        display: inline-block;
    }
    .content-list {
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
        padding-left: 20px;
    }
    .content-list li {
        margin-bottom: 4px;
    }
    .text-block {
        font-size: 14px;
        line-height: 1.6;
        color: #4a5568;
    }
    .field-line {
        font-size: 14px;
        line-height: 1.6;
        color: #4a5568;
    }
    .field-line .field-label {
        display: inline-block;
        min-width: 88px;
        color: #2d3748;
        font-weight: bold;
    }
    .codex-img {
        display: block;
        max-width: 100%;
        margin-top: 6px;
        border-radius: 6px;
    }

    /* 两列布局用于紧凑展示 */
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .highlight { color: #e53e3e; font-weight: bold; }
    .must { color: #d69e2e; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
    <h1>赋光之人 · 队伍攻略</h1>
</div>

<!--{{CARDS}}-->
</body>
</html>
