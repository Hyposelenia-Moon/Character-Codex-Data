<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>赋光之人 队伍攻略</title>
<style>
    /*
     * 字体：汉仪文黑-85W（原神内置的 hk4e 字体）**不随仓库分发**，用
     *   node scripts/fetch-font.mjs
     * 从上游图鉴仓库取回同名字体文件放到仓库根目录。取不到时下面的回退栈兜底，
     * 观感与有字体时接近（MiSans / Noto Sans SC / 思源黑体都是免费可商用字体）。
     */
    @font-face {
        font-family: 'HYWenHei-85W';
        src: url('./汉仪文黑-85W.ttf') format('truetype');
        /* 如果使用 woff2 格式，请改为：src: url('./汉仪文黑-85W.woff2') format('woff2'); */
        font-weight: normal;
        font-style: normal;
    }

    body {
        /* 有 汉仪文黑-85W 时优先用它；否则退到免费字体（MiSans / Noto Sans SC / 思源黑体） */
        font-family: 'HYWenHei-85W', 'MiSans', 'Source Han Sans SC', 'Noto Sans CJK SC', 'Noto Sans SC', '思源黑体', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        /* 保留后备字体，防止字体加载失败时页面无法正常显示 */
        background-color: #f4f6f9;
        color: #333;
        margin: 0;
        padding: 20px;
        width: 860px;
        box-sizing: border-box;
    }
    .header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 2px solid #4a5568;
    }
    .header h1 {
        color: #2d3748;
        margin: 0;
        font-size: 28px;
    }
    .guide-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        margin-bottom: 25px;
        padding: 20px;
        page-break-inside: avoid;
    }
    .char-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }
    .char-name {
        font-size: 22px;
        font-weight: bold;
        color: #1a202c;
        display: flex;
        align-items: center;
    }
    .char-tags {
        display: flex;
        gap: 10px;
    }
    .tag {
        background: #edf2f7;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 13px;
        color: #4a5568;
    }
    .tag.level { background: #e6fffa; color: #319795; }
    .tag.role { background: #ebf8ff; color: #3182ce; }

    .section {
        margin-bottom: 12px;
        padding: 8px 10px 10px;
        border: 1px solid #e8edf5;
        border-radius: 8px;
        background: #fcfdff;
    }
    .section-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: bold;
        color: #2b4c7e;
        font-size: 15px;
        margin-bottom: 8px;
        padding-bottom: 6px;
        background: none;
        border-bottom: 1px solid #e6edf7;
    }
    /* 模块序号徽标（1…6，与面板的 .codex-badge 对应） */
    .section-badge {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #2b6cb0;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        line-height: 20px;
        text-align: center;
    }
    .section-empty {
        background: #fafbfc;
        border-style: dashed;
        border-color: #e2e8f0;
    }
    .section-empty-text {
        font-size: 13px;
        color: #a0aec0;
        padding: 2px 0;
    }
    .rows, .team-rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .row {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        column-gap: 8px;
        align-items: start;
        font-size: 13px;
        line-height: 1.7;
        color: #4a5568;
    }
    .row.row-nolabel { grid-template-columns: minmax(0, 1fr); }
    .row-label {
        display: block;
        padding: 0 6px;
        border-radius: 4px;
        background: #eef3fa;
        color: #2b4c7e;
        font-size: 12px;
        font-weight: bold;
        line-height: 1.8;
        text-align: center;
    }
    .row-value { min-width: 0; overflow-wrap: break-word; }
    /* 档位序列：条目 + 分隔符（推荐 › 可选 › 过渡） */
    .rank-list { display: inline; }
    .rank-unit { display: inline; white-space: nowrap; }
    .rank-item {
        display: inline-block;
        padding: 0 7px;
        border: 1px solid #e3e9f2;
        border-radius: 6px;
        background: #f5f8fc;
        color: #2d3748;
        font-size: 12.5px;
        line-height: 1.7;
    }
    .rank-note { color: #8a8378; font-size: 11.5px; font-style: italic; }
    .sep { color: #a9b4c4; font-weight: bold; padding: 0 3px; font-size: 12px; }
    /* 行内备注（注：…）与段末备注行：小一号灰字 */
    .row-note { display: block; color: #8a8378; font-size: 12px; font-style: italic; }
    /* 配队成员 */
    .team-member {
        display: inline-block;
        padding: 0 9px;
        border: 1px solid #dfe6f0;
        border-radius: 12px;
        background: #f4f7fb;
        color: #2d3748;
        font-size: 12.5px;
        line-height: 1.8;
    }
    .team-plus { color: #a9b4c4; padding: 0 4px; font-size: 12px; }
    .team-note-inline { color: #8a8378; font-size: 11.5px; font-style: italic; }
    .content-list {
        font-size: 14px;
        line-height: 1.6;
        margin: 0;
        padding-left: 20px;
    }
    .content-list li {
        margin-bottom: 4px;
    }
    .text-block {
        font-size: 14px;
        line-height: 1.6;
        color: #4a5568;
    }
    .field-line {
        font-size: 14px;
        line-height: 1.6;
        color: #4a5568;
    }
    .field-line .field-label {
        display: inline-block;
        min-width: 88px;
        color: #2d3748;
        font-weight: bold;
    }
    .codex-img {
        display: block;
        max-width: 100%;
        margin-top: 6px;
        border-radius: 6px;
    }

    /* 两列布局用于紧凑展示 */
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }
    .highlight { color: #e53e3e; font-weight: bold; }
    .must { color: #d69e2e; font-weight: bold; }
</style>
</head>
<body>

<div class="header">
    <h1>赋光之人 · 队伍攻略</h1>
</div>

<!--{{CARDS}}-->
</body>
</html>
